<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <title>FAMILY LOPEZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: rgba(18, 18, 28, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.3);
      --text: #f3f4f6;
      --text-sub: #9ca3af;
      --gold: #f59e0b;
      --silver: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Anuphan', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.is-gated { overflow: hidden; }

    /* Enter Gate Overlay */
    #enterOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0a0a0f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    #enterOverlay.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    
    .enter-btn {
      padding: 1rem 2.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 0 30px var(--primary-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .enter-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.5);
    }

    /* Header & Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(10, 10, 15, 0.8);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; color: #fff; }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { color: var(--text-sub); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.is-active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

    /* Sound Toggle Button */
    .sound-toggle {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .sound-toggle.is-playing { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

    /* Layout Main Containers */
    main { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    section { margin-bottom: 4rem; scroll-margin-top: 100px; }
    .section-title { font-size: 1.8rem; margin-bottom: 1.5rem; text-align: center; font-family: 'Space Grotesk', sans-serif; letter-spacing: 1px; }

    /* Search Bar */
    .search-wrap { max-width: 500px; margin: 0 auto 2rem auto; position: relative; }
    .search-input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 1.2rem;
    }

    /* Member Cards & Grid */
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .member-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.3s, border-color 0.3s;
      backdrop-filter: blur(8px);
    }
    .member-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.3); }
    .member-card.founder { border-color: var(--gold); box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
    .member-card.co-leader { border-color: var(--silver); }

    .avatar-box {
      width: 80px; height: 80px; margin: 0 auto 1rem auto;
      border-radius: 50%; overflow: hidden; background: rgba(255,255,255,0.1);
      display: grid; place-items: center; font-size: 1.8rem; font-weight: 700;
    }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }

    .role-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.75rem;
      border-radius: 20px; margin-bottom: 0.5rem; text-transform: uppercase;
    }
    .badge-founder { background: rgba(245, 158, 11, 0.2); color: var(--gold); }
    .badge-leader { background: rgba(56, 189, 248, 0.2); color: var(--silver); }

    .member-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.8rem; }
    .fb-link {
      display: inline-block; color: var(--text-sub); text-decoration: none;
      font-size: 0.85rem; transition: color 0.2s;
    }
    .fb-link:hover { color: #60a5fa; }

    /* Social Cards (Contacts & Partners) */
    .social-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .social-card {
      display: flex; align-items: center; gap: 1rem;
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 1rem 1.2rem; border-radius: 12px; text-decoration: none; color: #fff;
      transition: background 0.2s, transform 0.2s;
    }
    .social-card:hover { background: rgba(255,255,255,0.1); transform: translateX(4px); }
    .social-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .social-info { flex: 1; }
    .social-name { font-weight: 600; font-size: 0.95rem; }
    .social-handle { font-size: 0.8rem; color: var(--text-sub); }

    .hidden { display: none !important; }
    .loading-state, .error-state { text-align: center; padding: 2rem; color: var(--text-sub); }
  </style>
</head>
<body class="is-gated">

  <!-- Enter Gate -->
  <div id="enterOverlay">
    <h1 style="font-family: 'Space Grotesk'; font-size: 3rem; margin-bottom: 1rem; letter-spacing: 4px;">FAMILY LOPEZ</h1>
    <p style="color: var(--text-sub); margin-bottom: 2rem;">Welcome to Our Official Guild & Community Hub</p>
    <button class="enter-btn" onclick="enterSite()">CLICK TO ENTER</button>
  </div>

  <!-- Background Music Player (Hidden) -->
  <div id="youtube-player" style="position: absolute; width:0; height:0; overflow:hidden;"></div>

  <!-- Navigation Bar -->
  <header>
    <div class="logo">LOPEZ</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#top">หน้าแรก</a></li>
        <li><a href="#members">สมาชิก</a></li>
        <li><a href="#contact">ติดต่อ</a></li>
        <li><a href="#partners">พันธมิตร</a></li>
      </ul>
    </nav>
    <button id="soundToggle" class="sound-toggle" onclick="toggleSound()" hidden aria-pressed="false">
      <span id="soundLabel">MUSIC OFF</span>
    </button>
  </header>

  <main id="top">
    <!-- Members Section -->
    <section id="members">
      <h2 class="section-title">GUILD MEMBERS</h2>
      
      <div class="search-wrap" id="searchWrap">
        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหารายชื่อสมาชิก... (กด / เพื่อพิมพ์)" oninput="filterMembers()">
        <button id="searchClear" class="search-clear" onclick="clearSearch()" hidden>&times;</button>
      </div>

      <div id="resultCount" style="text-align: center; margin-bottom: 1.5rem; color: var(--text-sub); font-size: 0.9rem;"></div>

      <div id="membersContainer">
        <div class="roster-group" id="groupFounder" data-total="0">
          <h3 style="color: var(--gold); margin-bottom: 1rem;">FOUNDER</h3>
          <div class="roster-grid" id="founderGrid"></div>
        </div>
        
        <div class="roster-group" id="groupLeader" data-total="0" style="margin-top: 2rem;">
          <h3 style="color: var(--silver); margin-bottom: 1rem;">LEADERS</h3>
          <div class="roster-grid" id="leaderGrid"></div>
        </div>

        <div class="roster-group" id="groupMember" data-total="0" style="margin-top: 2rem;">
          <h3
